name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18.15.0
        uses: actions/setup-node@v4
        with:
          node-version: 18.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build Docker image
        run: docker build -t demo-devops-nodejs:${{ github.sha }} .

      - name: Run Docker container
        run: |
          docker run -d --name demo-devops-nodejs -p 8000:8000 demo-devops-nodejs:${{ github.sha }}
          sleep 10

      - name: Test API endpoint
        run: curl -f http://localhost:8000/api/users

      - name: Stop container
        if: always()
        run: docker rm -f demo-devops-nodejs || true